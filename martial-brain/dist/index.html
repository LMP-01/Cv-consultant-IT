    <title>Combat OS · Second cerveau martial</title>

    <!--
      Les polices sont préchargées : elles sont servies depuis le même domaine
      et le texte est le premier pixel utile de l'application. Sans cela, le
      navigateur ne les découvre qu'après avoir analysé la feuille de style.
    -->
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Les préférences d'affichage sont posées AVANT le premier rendu.
      Les appliquer depuis React ferait clignoter l'écran en clair pendant une
      frame avant de basculer en sombre — et ce clignotement, sur une
      application utilisée tous les jours pendant des années, se remarque.
      Ce script est délibérément minuscule, synchrone et sans dépendance.
    -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('combat-os.prefs') || '{}');
        var r = document.documentElement;
        var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : null;
        if (!t && p.theme === 'system') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        r.dataset.theme = t || 'dark';
        if (p.contrast === 'high') r.dataset.contrast = 'high';
        if (typeof p.fontScale === 'number') r.style.setProperty('--font-scale', p.fontScale);
      } catch (e) {
        /* stockage refusé : les valeurs par défaut conviennent */
      }
    </script>

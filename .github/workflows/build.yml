name: Build CV PDFs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build_cv.py"
      - ".github/workflows/build_cv_en.py"
      - ".github/workflows/build_dev_perso.py"
      - ".github/workflows/build_recap_tech.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-cv
  cancel-in-progress: false
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab==4.5.0
      - run: python .github/workflows/build_cv.py
      - run: python .github/workflows/build_cv_en.py
      - run: python .github/workflows/build_dev_perso.py
      - run: python .github/workflows/build_recap_tech.py
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV_Theo_Manso_Pinto_FR.pdf CV_Theo_Manso_Pinto_EN.pdf DEVELOPPEMENT_PERSONNEL.pdf RECAP_TECHNIQUE.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
            exit 0
          fi
          git commit -m "Build CV PDFs [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "Retry $i..."
            sleep 3
          done
          exit 1
